name: Build Helium Pacman Package & Update Repo

on:
  schedule:
    - cron: '0 6 * * *' # Check daily at 06:00 UTC
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force rebuild even if version matches'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-and-build:
    name: Sync with AUR & Build Package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with Upstream AUR
        id: sync_aur
        run: |
          echo "Checking upstream aur.archlinux.org for updates..."
          git clone --depth=1 https://aur.archlinux.org/helium-browser-bin.git /tmp/aur-upstream

          AUR_UPDATED="false"
          for f in PKGBUILD .SRCINFO 0001-update-wrapper-arch.patch 0002-align-desktop-entry.patch LICENSE; do
            if [ -f "/tmp/aur-upstream/$f" ]; then
              if [ ! -f "$f" ] || ! cmp -s "/tmp/aur-upstream/$f" "$f"; then
                echo "File $f updated from AUR"
                cp -f "/tmp/aur-upstream/$f" "$f"
                AUR_UPDATED="true"
              fi
            fi
          done

          echo "aur_updated=${AUR_UPDATED}" >> $GITHUB_OUTPUT

      - name: Commit AUR Updates to Main
        if: steps.sync_aur.outputs.aur_updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO 0001-update-wrapper-arch.patch 0002-align-desktop-entry.patch LICENSE
          PKGVER=$(grep -E '^[[:space:]]*pkgver=' PKGBUILD | head -n1 | cut -d= -f2 | tr -d "'\" ")
          PKGREL=$(grep -E '^[[:space:]]*pkgrel=' PKGBUILD | head -n1 | cut -d= -f2 | tr -d "'\" ")
          git commit -m "chore(aur): sync with upstream AUR (${PKGVER}-${PKGREL})"
          git push origin main

      - name: Check Existing Package Version in Release
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKGVER=$(grep -E '^[[:space:]]*pkgver=' PKGBUILD | head -n1 | cut -d= -f2 | tr -d "'\" ")
          PKGREL=$(grep -E '^[[:space:]]*pkgrel=' PKGBUILD | head -n1 | cut -d= -f2 | tr -d "'\" ")
          TARGET_PKG="helium-browser-bin-${PKGVER}-${PKGREL}-x86_64.pkg.tar.zst"
          echo "pkgver=${PKGVER}" >> $GITHUB_OUTPUT
          echo "pkgrel=${PKGREL}" >> $GITHUB_OUTPUT
          echo "target_pkg=${TARGET_PKG}" >> $GITHUB_OUTPUT

          EXISTS="false"
          if gh release view repo -R "${{ github.repository }}" >/dev/null 2>&1; then
            if gh release view repo -R "${{ github.repository }}" --json assets -q ".assets[].name" | grep -qx "${TARGET_PKG}"; then
              EXISTS="true"
            fi
          fi
          echo "exists=${EXISTS}" >> $GITHUB_OUTPUT
          echo "Target package: ${TARGET_PKG}"
          echo "Package exists in release: ${EXISTS}"

      - name: Build Arch Linux Package & Update Repo DB
        if: ${{ inputs.force_build == true || steps.check_release.outputs.exists != 'true' || steps.sync_aur.outputs.aur_updated == 'true' || github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARCH_REPO="${GITHUB_WORKSPACE}/arch_repo"
          BUILD_DIR="${GITHUB_WORKSPACE}/build_dir"
          mkdir -p "${ARCH_REPO}" "${BUILD_DIR}"

          # Copy AUR source files into build directory
          cp -a PKGBUILD 0001-update-wrapper-arch.patch 0002-align-desktop-entry.patch "${BUILD_DIR}/"
          [ -f LICENSE ] && cp -a LICENSE "${BUILD_DIR}/"

          # Pull existing repo DB from release if present
          cd "${ARCH_REPO}"
          if gh release view repo -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release download repo -R "${{ github.repository }}" -p "custom-helium.db.tar.gz" -p "custom-helium.files.tar.gz" 2>/dev/null || true
          fi

          # Run official makepkg in Arch Linux container
          docker run --rm \
            -v "${BUILD_DIR}":/build \
            -v "${ARCH_REPO}":/repo \
            -w /build \
            archlinux:latest bash -c '
              set -euxo pipefail

              # Upgrade keyring and install core packaging utilities
              pacman -Sy --noconfirm archlinux-keyring
              pacman -S --noconfirm --needed base-devel git sudo pacman-contrib

              # Set up unprivileged user for makepkg
              useradd -m -s /bin/bash builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
              chmod 0440 /etc/sudoers.d/builder
              chown -R builder:builder /build /repo

              # Import upstream Helium PGP signing key
              su builder -c "
                KEY_IMPORTED=false
                for server in hkps://keys.openpgp.org keyserver.ubuntu.com keys.gnupg.net; do
                  if gpg --keyserver \"\$server\" --recv-keys BE677C1989D35EAB2C5F26C9351601AD01D6378E; then
                    KEY_IMPORTED=true
                    break
                  fi
                done
                if [ \"\$KEY_IMPORTED\" != \"true\" ]; then
                  gpg --recv-keys BE677C1989D35EAB2C5F26C9351601AD01D6378E || true
                fi
              "

              # Run makepkg: downloads sources, verifies PGP/SHA256, patches, packages
              su builder -c "makepkg -s --noconfirm --clean"

              # Move built package to repo directory
              cp -f /build/helium-browser-bin-*.pkg.tar.zst /repo/
              chown -R root:root /repo

              # Update Pacman database
              cd /repo
              PKG_FILE=$(ls helium-browser-bin-*.pkg.tar.zst | sort -V | tail -n 1)
              repo-remove custom-helium.db.tar.gz helium-browser-bin || true
              repo-add -R custom-helium.db.tar.gz "${PKG_FILE}"

              rm -f custom-helium.db custom-helium.files
              cp -f custom-helium.db.tar.gz custom-helium.db
              cp -f custom-helium.files.tar.gz custom-helium.files
            '

          # Publish to GitHub Release
          cd "${ARCH_REPO}"
          echo "Publishing repository assets:"
          ls -la
          if gh release view repo -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload repo * -R "${{ github.repository }}" --clobber
          else
            gh release create repo * -R "${{ github.repository }}" \
              --title "Helium Arch Linux Repository" \
              --notes "Automated Pacman repository for Helium Browser on Arch Linux mirroring upstream aur.archlinux.org. Add this repo to /etc/pacman.conf to receive automated updates on 'pacman -Syu'."
          fi
